name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - test
      - main
    paths:
      - pyproject.toml
      - src/**

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Build distributions
        run: |
          python -m pip install "build==1.5.0"
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    needs: build
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

  publish-pypi:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Require matching TestPyPI release
        run: |
          version="$(python - <<'PY'
          from pathlib import Path
          import re

          wheels = sorted(Path("dist").glob("aislop-*.whl"))
          if not wheels:
              raise SystemExit("No aislop wheel found in dist/")

          match = re.match(r"aislop-(.+?)-py3-none-any\.whl", wheels[0].name)
          if not match:
              raise SystemExit(f"Could not parse version from {wheels[0].name}")

          print(match.group(1))
          PY
          )"
          curl --fail --silent --show-error "https://test.pypi.org/pypi/aislop/${version}/json" >/dev/null
          echo "Found aislop ${version} on TestPyPI."
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
