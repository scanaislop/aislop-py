[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aislop"
version = "0.10.2"
description = "Python launcher for the aislop CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Kenny Olawuwo" }
]
keywords = [
  "aislop",
  "ai-slop",
  "cli",
  "code-quality",
  "static-analysis"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance"
]

[project.urls]
Homepage = "https://scanaislop.com"
Repository = "https://github.com/scanaislop/aislop"
Issues = "https://github.com/scanaislop/aislop/issues"

[project.scripts]
aislop = "aislop_py.cli:main"
aislop-mcp = "aislop_py.cli:main_mcp"

[tool.setuptools.packages.find]
where = ["src"]
