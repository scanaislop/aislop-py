[build-system]
requires = ["setuptools==80.9.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aislop"
version = "0.14.1"
description = "Install aislop with Python tooling and scan your code for AI slop"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Scanaislop" }
]
keywords = [
  "aislop",
  "ai-slop",
  "cli",
  "code-quality",
  "cpp",
  "csharp",
  "dotnet",
  "static-analysis"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance"
]

[project.urls]
Homepage = "https://scanaislop.com"
Repository = "https://github.com/scanaislop/aislop"
Documentation = "https://scanaislop.com/docs"
Issues = "https://github.com/scanaislop/aislop/issues"
Homebrew = "https://github.com/scanaislop/homebrew-tap"

[project.scripts]
aislop = "aislop_py.cli:main"
aislop-mcp = "aislop_py.cli:main_mcp"

[tool.setuptools.packages.find]
where = ["src"]
